modules:
  jira:projectPage:
    - key: tracewise-hello-world-project-page
      resource: main
      resolver:
        function: resolver
      title: TraceWise
  jira:globalPage:
    - key: tracewise-hello-world-global-page
      resource: main
      resolver:
        function: resolver
      title: TraceWise
  sql:
    - key: main
      engine: mysql
  scheduledTrigger:
    - key: tracewise-migrate
      function: run-migration
      interval: hour
  function:
    - key: resolver
      handler: index.handler
    - key: run-migration
      handler: sql-poc.runMigration
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:page:confluence
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/df979358-8675-46fc-88c6-d99e04c2a1bc
