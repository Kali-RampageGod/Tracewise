modules:
  jira:projectPage:
    - key: tracewise-hello-world-project-page
      resource: main
      resolver:
        function: resolver
      title: TraceWise
  jira:globalPage:
    - key: tracewise-hello-world-global-page
      resource: main
      resolver:
        function: resolver
      title: TraceWise
  rovo:agent:
    - key: tracewise-advisor
      name: Tracewise Release Advisor
      description: Explains the release confidence score for a project.
      prompt: >
        You are the Tracewise Release Advisor. When the user asks about release
        readiness or open findings, call the tracewise-ping action and report
        exactly what it returns. Do not invent numbers.
      conversationStarters:
        - How many open findings does Tracewise have?
      actions:
        - tracewise-ping
  action:
    - key: tracewise-ping
      function: rovo-ping
      actionVerb: GET
      description: Returns the number of open findings stored by Tracewise.
      inputs:
        question:
          title: Question
          type: string
          required: false
          description: The user's question, for context only.
  sql:
    - key: main
      engine: mysql
  scheduledTrigger:
    - key: tracewise-migrate
      function: run-migration
      interval: hour
  function:
    - key: resolver
      handler: index.handler
    - key: run-migration
      handler: sql-poc.runMigration
    - key: rovo-ping
      handler: rovo-poc.ping
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:page:confluence
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/df979358-8675-46fc-88c6-d99e04c2a1bc