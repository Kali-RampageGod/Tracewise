modules:
  jira:projectPage:
    - key: tracewise-project-page
      resource: main
      resolver:
        function: resolver
      title: TraceWise
  jira:projectSettingsPage:
    - key: tracewise-settings-page
      resource: main
      resolver:
        function: resolver
      title: TraceWise
  jira:globalPage:
    - key: tracewise-global-page
      resource: main
      resolver:
        function: resolver
      title: TraceWise
  rovo:agent:
    - key: tracewise-advisor
      name: Tracewise Release Advisor
      description: Explains the release confidence score for a project.
      prompt: >
        You are the Tracewise Release Advisor. When the user asks about release
        readiness or open findings, call the tracewise-ping action and report
        exactly what it returns. Do not invent numbers.
      conversationStarters:
        - How many open findings does Tracewise have?
      actions:
        - tracewise-ping
  consumer:
    - key: tracewise-ingest-consumer
      queue: tracewise-ingest
      function: ingest-consumer
  action:
    - key: tracewise-ping
      name: Tracewise ping
      function: rovo-ping
      actionVerb: GET
      description: Returns the number of open findings stored by Tracewise.
      inputs:
        question:
          title: Question
          type: string
          required: false
          description: The user's question, for context only.
  trigger:
    - key: tracewise-jira-events
      function: source-event
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
  sql:
    - key: main
      engine: mysql
  scheduledTrigger:
    - key: tracewise-migrate
      function: run-migration
      interval: hour
    - key: tracewise-reconcile
      function: reconcile-scan
      interval: hour
  function:
    - key: resolver
      handler: index.handler
    - key: run-migration
      handler: migrations.runMigration
    - key: rovo-ping
      handler: rovo-poc.ping
    - key: source-event
      handler: triggers.onSourceEvent
    - key: ingest-consumer
      handler: consumer.handler
      timeoutSeconds: 120
    - key: reconcile-scan
      handler: reconcile.run
      timeoutSeconds: 120
resources:
  - key: main
    path: static/hello-world/build
permissions:
  scopes:
    - read:page:confluence
    - read:confluence-content.summary
    - read:jira-work
    - write:jira-work
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/df979358-8675-46fc-88c6-d99e04c2a1bc